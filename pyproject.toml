[project]
name = "asoy"
version = "0.1.0"
description = "Converts books into text prepared for audiobook narration, entirely on your own machine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Enrico Acha", email = "22210591+enepac@users.noreply.github.com" }
]
keywords = ["audiobook", "accessibility", "ebook", "narration", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]
dependencies = [
    "docling>=2.118.1",
    "nvidia-ml-py>=13.610.43",
    # ADR-019 specifies ONNX Runtime as RapidOCR's backend on both tiers. Without it RapidOCR
    # silently falls back to its PyTorch engine, which is a different engine than the one the
    # decision records (ADR-029, INC-003). MIT; its transitive additions are all permissive.
    "onnxruntime>=1.28.0",
    # Docling's OpenDocument backend. Apache-2.0; its only runtime dependency is lxml
    # (BSD-3-Clause), already in the tree. Required for the ODT path in ADR-023.
    "odfdo>=3.24.3",
    "ollama>=0.6.2",
    "pypdfium2>=5.12.1",
    "pywebview>=5.3",
    "rapidocr>=3.9.2",
]

[project.scripts]
asoy = "asoy.__main__:main"

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asoy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The reference run makes one real vision call per block, so it needs Ollama and the
# tier's model. Excluded by default; run it with -m reference. See docs/RUNBOOK.md §9.
addopts = "-m 'not reference'"
markers = [
    "reference: measures the classifier against the committed reference set",
]
